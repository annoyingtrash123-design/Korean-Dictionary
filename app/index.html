<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>한뿌리 · Korean Dictionary</title>
    <meta name="description" content="Offline Korean–English dictionary" />
    <meta name="theme-color" content="#294d38" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <script>
      // Apply the saved theme before first paint (keep in sync with src/lib/theme.ts).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('kd.settings') || '{}');
          var t = s.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t !== 'dark') t = 'light'; // the old Sepia theme is now Light (parchment)
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          var m = { accent: '--accent', bg: '--bg', text: '--text', hangul: '--hangul', hanja: '--hanja' };
          var c = s.colors || {};
          for (var k in m) if (c[k]) r.style.setProperty(m[k], c[k]);
          r.style.setProperty('--entry-font-size', (s.fontSize || 17) + 'px');
          document.querySelector('meta[name=theme-color]').setAttribute('content', { light: '#294d38', dark: '#1f3a2a' }[t]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
