[package]
name = "kdict-pipeline"
version = "0.1.0"
edition = "2021"
description = "Data pipeline for the offline Korean-English dictionary PWA"
publish = false

[[bin]]
name = "kdict-pipeline"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
