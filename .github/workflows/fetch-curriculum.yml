name: Fetch curriculum

# One-off: download the 국립국어원 "국제 통용 한국어 표준 교육과정" materials (korean.go.kr is only
# reachable from Actions) so they can be inspected. Results: artifact "curriculum". Inspection only.
on:
  workflow_dispatch:

permissions:
  contents: write  # only to publish the fetched files to the curriculum-data branch

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test the parser
        run: python3 -I pipeline/qa/curriculum/test_fetch_curriculum.py
      - name: Fetch
        run: |
          mkdir -p out/curriculum
          python3 pipeline/qa/curriculum/fetch_curriculum.py out/curriculum || echo "script failed: $?"
      - name: Show results
        if: always()
        run: |
          {
            echo '## manifest.json'
            echo '```json'
            cat out/curriculum/manifest.json 2>/dev/null || echo '(no manifest)'
            echo '```'
            echo '## ls -la'
            echo '```'
            ls -laR out/curriculum 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curriculum
          path: out/curriculum
          retention-days: 7
          if-no-files-found: warn
      # artifact storage is not reachable from the dev sandbox: publish the documents (KOGL-licensed
      # NIKL files; checked per page in manifest.json) to an orphan branch instead. Never touches main.
      - name: Publish files to the curriculum-data branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b curriculum-data
          cp "$GITHUB_WORKSPACE"/out/curriculum/manifest.json . 2>/dev/null || true
          find "$GITHUB_WORKSPACE"/out/curriculum/files -maxdepth 1 -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.pdf' -o -iname '*.hwp' -o -iname '*.txt' \) -size -60M -exec cp {} . \; 2>/dev/null || true
          ls -la
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "NIKL curriculum files fetched by run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" curriculum-data
