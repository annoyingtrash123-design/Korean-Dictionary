name: Build data & deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Force a fresh dictionary data build (ignore cache)"
        type: boolean
        default: false
      deploy:
        description: "Deploy to GitHub Pages after building"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore built data
        id: datacache
        if: ${{ !inputs.rebuild_data && github.event_name != 'schedule' }}
        uses: actions/cache@v4
        with:
          path: pipeline/out/site-data
          key: site-data-${{ hashFiles('pipeline/**', 'Cargo.lock') }}-${{ steps.key.outputs.month }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.datacache.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.datacache.outputs.cache-hit != 'true'

      - name: Restore downloaded sources
        if: steps.datacache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/.work
          key: sources-v2-${{ steps.key.outputs.month }}

      - name: Fetch sources
        if: steps.datacache.outputs.cache-hit != 'true'
        run: |
          cargo build --release -p kdict-pipeline
          ./target/release/kdict-pipeline fetch --work pipeline/.work

      - name: Fetch previous deploy's sources.json / manifest.json (for change detection)
        if: steps.datacache.outputs.cache-hit != 'true'
        run: |
          # absent on the first deploy or if the site is down: the comparison is then skipped
          base=https://annoyingtrash123-design.github.io/Korean-Dictionary/data
          mkdir -p pipeline/.prev
          for f in sources.json manifest.json; do
            curl -fsSL --retry 2 --max-time 60 -o "pipeline/.prev/$f" "$base/$f" || { echo "previous $f not available"; rm -f "pipeline/.prev/$f"; }
          done

      - name: Build dictionary packs
        if: steps.datacache.outputs.cache-hit != 'true'
        run: |
          prev=()
          [ -s pipeline/.prev/sources.json ] && prev+=(--prev-sources pipeline/.prev/sources.json)
          [ -s pipeline/.prev/manifest.json ] && prev+=(--prev-manifest pipeline/.prev/manifest.json)
          # no --allow-partial: the build fails when a source silently degraded (data quality gate)
          ./target/release/kdict-pipeline build --work pipeline/.work --out pipeline/out "${prev[@]}"
          # source changes + pack count drops (>2%) vs the previous deploy: job log and job summary
          cat pipeline/out/site-data/changes.md
          cat pipeline/out/site-data/changes.md >> "$GITHUB_STEP_SUMMARY"
          echo "::group::sources.json"; cat pipeline/out/site-data/sources.json; echo "::endgroup::"
          ls -la pipeline/out pipeline/out/site-data
          cat pipeline/out/site-data/manifest.json

      - name: Data QA report
        if: steps.datacache.outputs.cache-hit != 'true'
        run: |
          command -v sqlite3 || sudo apt-get install -y sqlite3
          sqlite3 pipeline/out/core.sqlite < pipeline/qa/core.sql
          for p in stdict opendict; do
            [ -f pipeline/out/$p.sqlite ] && { echo "######## $p"; sqlite3 pipeline/out/$p.sqlite < pipeline/qa/ko.sql; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: pipeline/out/site-data
          retention-days: 7

  # Verification gate: the same checks as scripts/verify.sh, against the freshly built data.
  # Nothing deploys unless this is green.
  verify:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The e2e suite downloads the full packs into a browser profile per test (~0.5-1 GB each); the
      # runner's free disk ran out mid-suite (Chromium write error -8 = no space). Remove preinstalled
      # SDKs this job never uses, and print the free space so a repeat is obvious in the log.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore wasm-pack
        id: wasmpack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.wasmpack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: app/public/data
      - name: Install app deps + browser
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: scripts/verify.sh (rust tests, clippy, wasm, typecheck, unit, e2e)
        env:
          CI: "true"
        run: scripts/verify.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 14

  app:
    needs: [data, verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Restore wasm-pack
        id: wasmpack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.wasmpack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm ci
      - run: npm run build:core
      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: app/public/data
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: app
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
