[workspace]
members = ["pipeline", "core"]
resolver = "2"

[profile.release]
opt-level = 3

# The wasm engine is size-sensitive; these overrides only affect the core crate
# (and the wasm-only SQLite build), never the native pipeline binary.
[profile.release.package.kdict-core]
opt-level = "z"

[profile.release.package.sqlite-wasm-rs]
opt-level = "z"
