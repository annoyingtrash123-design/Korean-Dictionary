[package]
name = "kdict-core"
version = "0.1.0"
edition = "2021"
description = "Core engine (search, deconjugation, SQLite packs) of the offline Korean-English dictionary PWA, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native (tests, tooling): the same bundled SQLite the pipeline uses to build the packs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# Browser: SQLite compiled to wasm (FTS5 enabled) + OPFS sahpool VFS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
sqlite-wasm-rs = { version = "0.6", default-features = false, features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
rsqlite-vfs = "0.2"

# wasm-opt for speed, not size: every keystroke runs SQLite queries in this module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]

[dev-dependencies]
flate2 = "1"
